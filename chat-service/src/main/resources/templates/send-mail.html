<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="dark">
    <meta name="supported-color-schemes" content="dark">
    <title th:text="${subject}">Message from Blinx AI</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>
        body,
        table,
        td,
        a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        table,
        td {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }

        body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
        }

        @media only screen and (max-width: 600px) {
            .container {
                width: 100% !important;
                max-width: 100% !important;
                border-radius: 0 !important;
                margin-top: 0 !important;
                border-left: none !important;
                border-right: none !important;
            }

            .content-pad {
                padding: 0 24px 32px 24px !important;
            }

            .header-pad {
                padding: 28px 24px 16px 24px !important;
            }

            .footer-pad {
                padding: 24px !important;
            }

            h1 {
                font-size: 18px !important;
            }
        }
    </style>
</head>

<body
    style="margin:0;padding:0;background-color:#000000;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
        style="background-color:#000000;">
        <tr>
            <td align="center" style="padding:40px 16px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="container"
                    style="max-width:600px;width:100%;background-color:#0a0a0a;border:1px solid #1a1a1a;border-radius:16px;overflow:hidden;">
                    <!-- Header -->
                    <tr>
                        <td class="header-pad" style="padding:40px 40px 20px 40px;">
                            <div style="font-size:24px;font-weight:800;letter-spacing:-0.5px;color:#ffffff;">Blinx<span
                                    style="color:#3b82f6;">AI</span></div>
                        </td>
                    </tr>
                    <!-- Content -->
                    <tr>
                        <td class="content-pad"
                            style="padding:0 40px 40px 40px;line-height:1.7;font-size:16px;color:#d4d4d4;">
                            <div th:utext="${body}" style="line-height:1.7;color:#d4d4d4;">
                                This is the body of the email.
                            </div>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td class="footer-pad"
                            style="padding:30px 40px;background-color:#050505;border-top:1px solid #1a1a1a;">
                            <p style="font-size:12px;color:#525252;margin:0 0 8px 0;line-height:1.6;">
                                This email was sent from <span style="color:#3b82f6;">Blinx AI Assistant</span>.
                            </p>
                            <p style="font-size:12px;color:#525252;margin:0 0 8px 0;line-height:1.6;">
                                For any inquiries, please contact <a href="mailto:support@blinxai.me"
                                    style="color:#3b82f6;text-decoration:none;">support@blinxai.me</a>
                            </p>
                            <p style="font-size:12px;color:#525252;margin:15px 0 0 0;line-height:1.6;">
                                &copy; 2026 Blinx AI. All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
